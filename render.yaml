services:
  - type: web
    name: fx-ml-api
    runtime: docker
    dockerfilePath: ./docker/Dockerfile.serve
    plan: free
    envVars:
      - key: OANDA_API_KEY
        sync: false
      - key: OANDA_ACCOUNT_ID
        sync: false
      - key: OANDA_ENVIRONMENT
        value: practice
      - key: MLFLOW_TRACKING_URI
        value: "sqlite:///mlflow.db"
    healthCheckPath: /health
    autoDeploy: true
    startCommand: |
      python -m src.serving.api &
      python -m src.serving.mcp_server models/ensemble_latest data/processed

  - type: worker
    name: fx-ml-paper-trader
    runtime: docker
    dockerfilePath: ./docker/Dockerfile.serve
    plan: free
    envVars:
      - key: OANDA_API_KEY
        sync: false
      - key: OANDA_ACCOUNT_ID
        sync: false
      - key: OANDA_ENVIRONMENT
        value: practice
    autoDeploy: true

  - type: cron
    name: fx-ml-trainer
    runtime: docker
    dockerfilePath: ./docker/Dockerfile.train
    plan: free
    schedule: "0 2 * * 0"
    envVars:
      - key: OANDA_API_KEY
        sync: false
      - key: OANDA_ACCOUNT_ID
        sync: false
      - key: OANDA_ENVIRONMENT
        value: practice
      - key: MLFLOW_TRACKING_URI
        value: "sqlite:///mlflow.db"
    autoDeploy: true